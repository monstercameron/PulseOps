<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" style="font-family: system-ui, sans-serif; background: #f9fafb; border-radius: 12px;">
  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0d1b2a">Cash Position Impact of Pricing Changes</text>
  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#6b7d8f">Weekly cash balance before and after rate adjustment (Q1 → Q2)</text>

  <!-- Y-axis label -->
  <text transform="rotate(-90,18,200)" x="18" y="200" text-anchor="middle" font-size="11" fill="#6b7d8f">Cash Balance ($k)</text>

  <!-- Grid lines -->
  <line x1="80" y1="80" x2="660" y2="80" stroke="#e4edf5" stroke-width="1"/>
  <line x1="80" y1="130" x2="660" y2="130" stroke="#e4edf5" stroke-width="1"/>
  <line x1="80" y1="180" x2="660" y2="180" stroke="#e4edf5" stroke-width="1"/>
  <line x1="80" y1="230" x2="660" y2="230" stroke="#e4edf5" stroke-width="1"/>
  <line x1="80" y1="280" x2="660" y2="280" stroke="#e4edf5" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="72" y="84" text-anchor="end" font-size="11" fill="#6b7d8f">$120k</text>
  <text x="72" y="134" text-anchor="end" font-size="11" fill="#6b7d8f">$90k</text>
  <text x="72" y="184" text-anchor="end" font-size="11" fill="#6b7d8f">$60k</text>
  <text x="72" y="234" text-anchor="end" font-size="11" fill="#6b7d8f">$30k</text>
  <text x="72" y="284" text-anchor="end" font-size="11" fill="#6b7d8f">$0</text>

  <!-- X axis -->
  <line x1="80" y1="280" x2="660" y2="280" stroke="#c8d6e0" stroke-width="1.5"/>

  <!-- X-axis week labels -->
  <text x="113" y="296" text-anchor="middle" font-size="10" fill="#6b7d8f">Jan W1</text>
  <text x="173" y="296" text-anchor="middle" font-size="10" fill="#6b7d8f">Jan W3</text>
  <text x="233" y="296" text-anchor="middle" font-size="10" fill="#6b7d8f">Feb W1</text>
  <text x="293" y="296" text-anchor="middle" font-size="10" fill="#6b7d8f">Feb W3</text>
  <text x="353" y="296" text-anchor="middle" font-size="10" fill="#6b7d8f">Mar W1</text>
  <text x="413" y="296" text-anchor="middle" font-size="10" fill="#6b7d8f">Mar W3</text>
  <text x="473" y="296" text-anchor="middle" font-size="10" fill="#6b7d8f">Apr W1</text>
  <text x="533" y="296" text-anchor="middle" font-size="10" fill="#6b7d8f">Apr W3</text>
  <text x="600" y="296" text-anchor="middle" font-size="10" fill="#6b7d8f">May W1</text>

  <!-- Cash line (before pricing change): drops then levels -->
  <!-- Points: (113,200)(173,220)(233,210)(293,240)(353,230) — declining drift -->
  <polyline
    points="113,200 173,220 233,210 293,240 353,230"
    fill="none"
    stroke="#94afc7"
    stroke-width="2.5"
    stroke-dasharray="6 3"
  />

  <!-- Cash line (after pricing change, starts Mar W1): improves steadily -->
  <polyline
    points="353,230 413,205 473,178 533,148 600,115"
    fill="none"
    stroke="#00c9a7"
    stroke-width="2.5"
  />

  <!-- Fill under post-change line -->
  <polygon
    points="353,230 413,205 473,178 533,148 600,115 600,280 353,280"
    fill="#00c9a7"
    fill-opacity="0.08"
  />

  <!-- Pricing change annotation -->
  <line x1="353" y1="80" x2="353" y2="280" stroke="#00c9a7" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="280" y="88" width="148" height="28" rx="6" fill="#0d1b2a"/>
  <text x="354" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#00c9a7">Pricing change applied</text>

  <!-- Cash crunch zone -->
  <rect x="233" y="248" width="120" height="32" rx="5" fill="#fff3cd" stroke="#e8c73a" stroke-width="1"/>
  <text x="293" y="263" text-anchor="middle" font-size="10" font-weight="600" fill="#a07800">⚠ Cash crunch risk</text>
  <text x="293" y="275" text-anchor="middle" font-size="10" fill="#a07800">Feb → Mar W1</text>

  <!-- Legend -->
  <line x1="430" y1="320" x2="460" y2="320" stroke="#94afc7" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="465" y="324" font-size="11" fill="#0d1b2a">Before pricing change</text>
  <line x1="570" y1="320" x2="600" y2="320" stroke="#00c9a7" stroke-width="2.5"/>
  <text x="605" y="324" font-size="11" fill="#0d1b2a">After</text>
</svg>
